<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enviar a Price Seeker</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<style>
  :root {
    --bg: #f6f5f2; --card: #fff; --ink: #1b1b1b; --muted: #6b6b6b; --line: #e4e2dc;
    --accent: #0f766e; --bad: #b42318; --warn: #92400e; --warn-bg: #fdf3e1; --radius: 12px;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.45; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h1.brand { display: flex; align-items: center; gap: 10px; }
  h1.brand img { width: 32px; height: 32px; flex: none; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .prod { display: grid; grid-template-columns: 88px 1fr; gap: 14px; margin-bottom: 16px; }
  .prod img { width: 88px; height: 88px; object-fit: contain; border: 1px solid var(--line); border-radius: 8px; background: #fafafa; }
  .store { font-size: 13px; color: var(--muted); }
  .prod img[src=""], .prod img:not([src]) { visibility: hidden; }
  #crop { width: 88px; height: 88px; border: 1px solid var(--line); border-radius: 8px; background-repeat: no-repeat; background-color: #fafafa; }
  #crop[hidden] { display: none; }
  .pick { display: block; text-align: center; font-size: 12px; color: var(--accent); cursor: pointer; margin: 4px 0 0; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input, textarea { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
  textarea { resize: vertical; min-height: 64px; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 14px; margin-top: 12px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; padding: 11px 18px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; font-weight: 600; margin-top: 16px; }
  button:disabled { opacity: .55; cursor: progress; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button.ghost { background: #fff; color: var(--accent); }
  .msg { min-height: 22px; margin-top: 12px; font-size: 14px; }
  .msg.error { color: var(--bad); }
  a { color: var(--accent); }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1 class="brand"><img src="/logo.svg" alt="" width="32" height="32">Enviar a Price Seeker</h1>
  <p class="sub">Revisa lo que leí de la página. Si el precio no es el correcto, corrígelo antes de guardar.</p>

  <div id="empty" class="card" hidden>
    <p>No llegaron datos. Abre un producto en Temu, Shein u otra tienda y pulsa el marcador <strong>Enviar a Price Seeker</strong>.</p>
    <p><a href="/">Volver a Price Seeker</a></p>
  </div>

  <form id="f" class="card" hidden>
    <div class="prod">
      <div>
        <img id="img" alt="Foto del producto" referrerpolicy="no-referrer">
        <div id="crop" role="img" aria-label="Recorte de la foto del producto" hidden></div>
        <label class="pick" for="file">Cambiar foto</label>
        <input id="file" type="file" accept="image/*" hidden>
      </div>
      <div>
        <div class="store" id="store"></div>
        <label for="title" style="margin-top:4px">Nombre del producto</label>
        <textarea id="title" name="title" required></textarea>
      </div>
    </div>
    <div class="row">
      <div>
        <label for="price">Precio actual (COP)</label>
        <input id="price" name="price" inputmode="numeric" required>
        <div class="hint" id="priceHint"></div>
      </div>
      <div>
        <label for="targetPrice">Precio objetivo (opcional)</label>
        <input id="targetPrice" name="targetPrice" inputmode="numeric" placeholder="Ej.: 50.000">
      </div>
    </div>
    <div class="hint" id="imgHint"></div>
    <label for="email">Correo para avisos (opcional)</label>
    <input id="email" name="email" type="email" placeholder="Si lo dejas vacío se usa el de .env">
    <div id="warn" class="warn" hidden></div>
    <div class="btns">
      <button type="submit" id="send">Guardar y comparar</button>
      <button type="button" id="onlySearch" class="ghost">Buscar sin seguir</button>
    </div>
    <div class="msg" id="msg" role="status"></div>
  </form>
</main>

<script>
const $ = (s) => document.querySelector(s);
const cop = (n) => '$' + Math.round(n).toLocaleString('es-CO');
let data = null;
try {
  data = JSON.parse(decodeURIComponent(location.hash.slice(1)));
} catch {}

// ---------- Foto del producto ----------
function setImage(src) {
  data.image = src;
  // Recorte hecho con la sombra del botón: #pscrop=x,y,ancho,alto (fracciones de la foto).
  const m = (src || '').match(/#pscrop=([\d.]+),([\d.]+),([\d.]+),([\d.]+)$/);
  const box = $('#crop');
  if (m) {
    const [x, y, w, h] = m.slice(1).map(Number);
    // Muestra solo esa zona: la foto se agranda y se desplaza dentro del recuadro.
    box.style.backgroundImage = `url("${src.split('#')[0].replace(/"/g, '%22')}")`;
    box.style.backgroundSize = `${100 / w}% ${100 / h}%`;
    box.style.backgroundPosition = `${w < 1 ? (x / (1 - w)) * 100 : 0}% ${h < 1 ? (y / (1 - h)) * 100 : 0}%`;
    box.style.aspectRatio = '';
    box.hidden = false;
    $('#img').hidden = true;
  } else {
    box.hidden = true;
    $('#img').hidden = false;
    if (src) $('#img').src = src;
    else $('#img').removeAttribute('src');
  }
  $('#imgHint').textContent = src
    ? (src.startsWith('data:') || m ? 'Foto: tu recorte. ' : 'Foto: la que estabas viendo en la página. ')
      + 'Si no es la del producto, pega otra aquí (Win+Shift+S y luego Ctrl+V).'
    : 'Sin foto. Para productos sin marca la foto ayuda a encontrarlo: pega una captura (Win+Shift+S y luego Ctrl+V).';
}

// Reduce la imagen a 480 px como máximo y la convierte a JPEG (liviana para enviar y comparar).
function useImageFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, 480 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k);
    c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    setImage(c.toDataURL('image/jpeg', 0.85));
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(file);
}

document.addEventListener('paste', (e) => {
  const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith('image/'));
  if (!item || !data) return;
  e.preventDefault();
  useImageFile(item.getAsFile());
});
$('#file').addEventListener('change', (e) => useImageFile(e.target.files[0]));

const KNOWN = [
  [/(^|\.)temu\.com$/i, 'Temu'], [/(^|\.)shein\./i, 'Shein'], [/(^|\.)amazon\./i, 'Amazon'],
  [/(^|\.)aliexpress\./i, 'AliExpress'], [/(^|\.)mercadoli(b|v)re\./i, 'Mercado Libre'],
];

if (!data || !data.url) {
  $('#empty').hidden = false;
} else {
  let host = '';
  try { host = new URL(data.url).hostname; } catch {}
  const storeName = (KNOWN.find(([re]) => re.test(host)) || [null, host])[1];
  $('#store').textContent = storeName;
  // Quita el sufijo de la tienda del título ("| Moda de Mujer | SHEIN Colombia", "- Temu Colombia").
  $('#title').value = (data.title || '')
    .replace(/\s*\|\s*[^|]{1,40}\|\s*shein[^|]*$/i, '')
    .replace(/\s*[-|:]\s*(aliexpress|temu|shein|amazon(\.[a-z.]+)?|mercado ?libre)(\s*\d+)?[^-|:]*$/i, '')
    .trim();
  setImage(/^(https?:\/\/|data:image\/)/i.test(data.image || '') ? data.image : null);

  // El precio leído puede venir como número (JSON-LD) o como texto ("$59.900").
  const raw = data.price == null ? '' : String(data.price);
  $('#price').value = raw.replace(/^[^\d]*/, '');
  $('#priceHint').textContent = raw
    ? `Leí: ${raw}${data.currency ? ' ' + data.currency : ''}`
    : 'No pude leer el precio: escríbelo tú.';
  if (!raw) {
    $('#warn').hidden = false;
    $('#warn').textContent = 'No encontré el precio en la página. Escríbelo tal como aparece.';
  }
  $('#f').hidden = false;
  (raw ? $('#targetPrice') : $('#price')).focus();
}

// Solo buscar: lleva el nombre y la foto a la barra de búsqueda de Price Seeker, sin seguir el producto.
$('#onlySearch').addEventListener('click', () => {
  const q = $('#title').value.replace(/\s+/g, ' ').trim().slice(0, 120);
  if (q.length < 2) {
    $('#msg').className = 'msg error';
    $('#msg').textContent = 'Escribe el nombre del producto para buscarlo.';
    return;
  }
  sessionStorage.setItem('ps-search', JSON.stringify({ q, image: data.image || null }));
  location.href = '/';
});

$('#f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#send');
  btn.disabled = true;
  $('#msg').className = 'msg';
  $('#msg').textContent = 'Guardando…';
  const body = {
    url: data.url,
    title: $('#title').value,
    price: $('#price').value,
    currency: data.currency || null,
    image: data.image || null,
    description: data.description || null,
    rating: data.rating ?? null,
    reviews: data.reviews ?? null,
    targetPrice: $('#targetPrice').value || undefined,
    email: $('#email').value || undefined,
  };
  try {
    const headers = { 'Content-Type': 'application/json' };
    const token = localStorage.getItem('pw-token');
    if (token) headers['x-app-token'] = token;
    const res = await fetch('/api/products/manual', { method: 'POST', headers, body: JSON.stringify(body) });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || `Error ${res.status}`);
    $('#msg').textContent = out.created
      ? `Listo: ahora sigues este producto a ${cop(out.product.source_price)}. Busco el mismo más barato en las otras tiendas…`
      : `Precio actualizado a ${cop(out.product.source_price)}. Vuelvo a comparar con las otras tiendas…`;
    setTimeout(() => { location.href = '/'; }, 1500);
  } catch (err) {
    $('#msg').className = 'msg error';
    $('#msg').textContent = err.message;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
